<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chezz</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <h1>Chezz</h1>

  <div id="menu">
    <button data-mode="hotseat">Hot-seat</button>
    <button data-mode="vscomputer">Vs Computer</button>
    <button data-mode="online">Online</button>
  </div>

  <div id="online-join" hidden>
    <input id="room-code-input" placeholder="Room code" maxlength="8" />
    <button id="join-room-btn">Join / Create room</button>
  </div>

  <div id="game" hidden>
    <p id="room-code-display" hidden></p>
    <p id="status"></p>
    <div id="board"></div>
    <div id="promotion-picker" hidden></div>
    <button id="new-game">New game</button>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
